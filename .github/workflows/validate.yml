name: Validate deployment files
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          for script in install.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck install.sh scripts/*.sh
      - name: Generate and validate configuration
        run: |
          bash scripts/init.sh
          before=$(sha256sum .env)
          bash scripts/init.sh
          test "$before" = "$(sha256sum .env)"
          python3 tests/test_ports.py
          python3 tests/test_installer.py
          sudo python3 scripts/select_ports.py
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate DNS certificate configuration
        run: |
          export COMPOSE_FILE=compose.yaml:compose.dns.yaml
          export CADDY_CONFIG=Caddyfile.dns
          export CF_API_TOKEN=validation-placeholder
          docker compose config --quiet
          docker compose build caddy
          docker compose run --rm --no-deps caddy caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
